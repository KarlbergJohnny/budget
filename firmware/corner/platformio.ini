; Hörnenhet: mäter avståndet till målplåten och sänder det som BLE advertising.
;
; Utan givare inkopplade skickar den simulerade värden (flaggan SIMULATED),
; så att hela kedjan hörn -> gateway -> server -> app kan testas direkt.
;
; Bygg och ladda upp:  pio run -e olimex_c3 -t upload
; Serieterminal:       pio device monitor -e olimex_c3

[platformio]
default_envs = olimex_c3
lib_dir = ../lib

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DVAGN_FW_VERSION=\"0.1.0\"
  ; Slå på givare när de är inkopplade:
  ; -DVAGN_USE_VL53L4CD=1
  ; -DVAGN_USE_HCSR04=1

; Olimex ESP32-C3-DevKit-Lipo (hörnenhet)
[env:olimex_c3]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Olimex C3 med VL53L4CD på I2C (UEXT: SDA/SCL)
[env:olimex_c3_vl53l4cd]
board = esp32-c3-devkitm-1
lib_deps =
  ${env.lib_deps}
  stm32duino/STM32duino VL53L4CD@^1.0.4
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DVAGN_USE_VL53L4CD=1

; Arduino Nano ESP32 som hörnenhet på bänken
[env:nano_esp32]
board = arduino_nano_esp32

; Wemos D1 R32 som hörnenhet på bänken
[env:d1r32]
board = wemos_d1_uno32
