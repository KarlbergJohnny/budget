; Gateway: lyssnar på hörnenheternas BLE advertising och skickar mätningarna
; till servern via wifi. LTE-M (SIM7080G på LilyGO-kortet) kommer i nästa steg.
;
; Kopiera include/secrets.example.h till include/secrets.h och fyll i wifi
; och serveradress innan du bygger.
;
; Bygg och ladda upp:  pio run -e nano_esp32 -t upload
; Serieterminal:       pio device monitor -e nano_esp32

[platformio]
default_envs = nano_esp32
lib_dir = ../lib

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DVAGN_FW_VERSION=\"0.1.0\"

; Arduino Nano ESP32 (ESP32-S3) – gateway på bänken
[env:nano_esp32]
board = arduino_nano_esp32

; Wemos D1 R32 (ESP32) – reservgateway på bänken
[env:d1r32]
board = wemos_d1_uno32

; LilyGO T-SIM7080G-S3 – wifi tills vidare, LTE-M läggs till senare
[env:lilygo_sim7080g_s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
